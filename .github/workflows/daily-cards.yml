name: 카드뉴스 생성

# 매일 오전 8시(KST) — 블로그가 아침에 발행된 뒤 도는 시각으로 맞추세요.
on:
  # GPT가 카드 JSON을 직접 보내면 즉시 실행됩니다 (블로그를 읽지 않음)
  repository_dispatch:
    types: [cardnews]
  schedule:
    - cron: "0 23 * * *"   # UTC 23:00 = KST 08:00
  workflow_dispatch:
    inputs:
      card_json:
        description: "카드 JSON 통째로 붙여넣기 (앱 연동 전에는 이 칸만 쓰면 됩니다)"
        required: false
      slug:
        description: "특정 글의 slug (비우면 최신 글)"
        required: false
      use_sample:
        description: "샘플 데이터로 시험 주행 (블로그를 읽지 않음)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: |
          set -e
          # apt 목록을 먼저 갱신하지 않으면 --with-deps 가 패키지를 못 찾는 경우가 있다
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra
          fc-list | grep -i "CJK KR" | head -3
          pip install playwright
          playwright install --with-deps chromium
          python3 -c "import playwright; print('playwright ok')"

      - name: 1~2단계 · 글 수집
        id: fetch
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          CARD_JSON: ${{ inputs.card_json }}
        run: |
          set +e
          # ⓪ 손으로 붙여넣은 카드 JSON — 앱 연동 전에도 오늘 바로 쓸 수 있는 길
          if [ -n "$CARD_JSON" ]; then
            printf '%s' "$CARD_JSON" > card.raw.json
            SLUG=$(python3 -c "import json;print(json.load(open('card.raw.json')).get('slug','?'))" 2>/dev/null)
            if [ -z "$SLUG" ] || [ "$SLUG" = "?" ]; then
              echo "::error::붙여넣은 내용이 JSON이 아니거나 slug가 없습니다. 여는 중괄호부터 닫는 중괄호까지 통째로 넣었는지 확인하세요."
              exit 1
            fi
            echo "::notice::붙여넣은 카드 JSON으로 만듭니다 ($SLUG)."
            exit 0
          fi
          # ① 앱이 직접 보낸 카드 JSON — 블로그를 읽지 않습니다
          #
          # GitHub는 client_payload의 최상위 항목을 10개까지만 받습니다.
          # 카드 JSON은 항목이 16개라 그대로 넣으면 거부되므로 card 한 겹으로 감싸서 받습니다.
          # 예전 방식(감싸지 않고 보낸 것)도 그대로 받아 줍니다.
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            printf '%s' "$PAYLOAD" > payload.json
            SLUG=$(python3 - <<'PY' 2>/dev/null
          import json
          d = json.load(open("payload.json", encoding="utf-8"))
          card = d["card"] if isinstance(d.get("card"), dict) else d
          json.dump(card, open("card.raw.json", "w", encoding="utf-8"), ensure_ascii=False)
          print(card.get("slug", ""))
          PY
          )
            if [ -z "$SLUG" ]; then
              echo "::error::받은 데이터에 slug가 없습니다. client_payload를 {\"card\": {…카드 JSON…}} 모양으로 보냈는지 확인하세요."
              exit 1
            fi
            echo "::notice::앱이 보낸 카드 JSON으로 만듭니다 ($SLUG)."
            exit 0
          fi
          # ② 샘플 시험 주행
          if [ "${{ inputs.use_sample }}" = "true" ]; then
            cp samples/demo-card.json card.raw.json
            echo "::notice::샘플 데이터로 시험 주행합니다. 블로그는 읽지 않습니다."
            exit 0
          fi
          # ③ 블로그에서 읽기 (방화벽이 열려 있을 때만 성공)
          python3 scripts/fetch_post.py \
            ${{ inputs.slug && format('--slug {0}', inputs.slug) || '' }} \
            --out card.raw.json
          code=$?
          if [ $code -eq 78 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::오늘 글에 카드뉴스 JSON이 없어 건너뜁니다."
            exit 0
          fi
          exit $code

      - name: 3단계 · 자동 교정
        if: steps.fetch.outputs.skip != 'true'
        run: python3 scripts/normalize_cardnews.py card.raw.json > card.json

      - name: 3단계 · 검증
        if: steps.fetch.outputs.skip != 'true'
        run: python3 scripts/validate_cardnews.py card.json

      - name: 4단계 · 카드 렌더
        if: steps.fetch.outputs.skip != 'true'
        run: |
          SLUG=$(python3 -c "import json;print(json.load(open('card.json'))['slug'])")
          echo "SLUG=$SLUG" >> $GITHUB_ENV
          mkdir -p docs/cards/$SLUG
          CARD_FONT="${{ vars.CARD_FONT || 'serif' }}" \
            python3 scripts/render_cards.py card.json docs/cards/$SLUG
          # 발행 스크립트가 기대하는 01.png ~ NN.png 이름으로 정리
          cd docs/cards/$SLUG
          i=1
          for f in ${SLUG}_*.png; do
            mv "$f" "$(printf '%02d' $i).png"
            i=$((i+1))
          done
          rm -f _cards.html
          cd -
          # 네이버 클립 등 세로 지면용 9:16 한 벌을 더 뽑아 clip/ 아래 둔다
          mkdir -p docs/cards/$SLUG/clip
          CARD_SIZE=9x16 CARD_FONT="${{ vars.CARD_FONT || 'serif' }}" \
            python3 scripts/render_cards.py card.json docs/cards/$SLUG/clip
          cd docs/cards/$SLUG/clip
          i=1
          for f in ${SLUG}_*.png; do
            mv "$f" "$(printf '%02d' $i).png"
            i=$((i+1))
          done
          rm -f _cards.html
          cd -
          cp card.json docs/cards/$SLUG/card.json

      - name: 5단계 · 검수 페이지 생성
        if: steps.fetch.outputs.skip != 'true'
        run: python3 scripts/build_preview.py docs/cards/$SLUG docs/index.html

      - name: 커밋 (공개 URL 확보)
        if: steps.fetch.outputs.skip != 'true'
        run: |
          git config user.name  "silso-bot"
          git config user.email "bot@silsolife.kr"
          git add docs
          git diff --cached --quiet || git commit -m "카드뉴스: $SLUG"
          git push

      - name: 토큰 만료 확인
        if: always()
        env:
          EXPIRES: ${{ vars.IG_TOKEN_EXPIRES }}
        run: |
          if [ -z "$EXPIRES" ]; then
            echo "::notice::IG_TOKEN_EXPIRES 변수가 없습니다. 토큰 만료일을 등록해두면 미리 경고합니다."
            exit 0
          fi
          LEFT=$(( ( $(date -d "$EXPIRES" +%s) - $(date +%s) ) / 86400 ))
          if [ "$LEFT" -lt 0 ]; then
            echo "::error::인스타그램 토큰이 $EXPIRES 에 만료됐습니다. 갱신하지 않으면 발행이 실패합니다."
          elif [ "$LEFT" -lt 14 ]; then
            echo "::warning::인스타그램 토큰 만료까지 ${LEFT}일 남았습니다 ($EXPIRES). scripts/ig_token.py refresh 로 연장하세요."
          else
            echo "토큰 만료까지 ${LEFT}일 남았습니다."
          fi

      - name: 요약
        if: steps.fetch.outputs.skip != 'true'
        run: |
          echo "### 카드뉴스 생성 완료 — \`$SLUG\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "검수 페이지에서 확인한 뒤, **인스타그램 발행** 워크플로를 수동 실행하세요." >> $GITHUB_STEP_SUMMARY
