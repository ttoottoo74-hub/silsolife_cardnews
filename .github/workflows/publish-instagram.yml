name: 인스타그램 발행

# 두 가지 방법으로 실행됩니다.
#   ① 앱이 텔레그램 승인을 받은 뒤 자동으로 (repository_dispatch)
#   ② 사람이 검수 페이지를 보고 손으로 (workflow_dispatch)
on:
  repository_dispatch:
    types: [publish-instagram]
  workflow_dispatch:
    inputs:
      slug:
        description: "발행할 카드뉴스의 slug"
        required: true
      dry_run:
        description: "모의 실행 (실제 발행하지 않음)"
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # 승인 게이트를 한 겹 더 두고 싶으면 리포지터리 설정에서
    # 'instagram' 환경에 필수 리뷰어를 지정하세요.
    environment: instagram
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 입력 정리
        id: v
        env:
          P_SLUG: ${{ github.event.client_payload.slug }}
          P_DRY: ${{ github.event.client_payload.dry_run }}
          I_SLUG: ${{ inputs.slug }}
          I_DRY: ${{ inputs.dry_run }}
        run: |
          set -e
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            SLUG="$P_SLUG"
            # 앱이 부를 때는 텔레그램에서 이미 승인을 받았으므로 실제 발행이 기본이다
            DRY="$P_DRY"; [ "$DRY" = "true" ] || DRY=false
          else
            SLUG="$I_SLUG"; DRY="$I_DRY"
          fi
          # slug를 셸에 그대로 넘기기 전에 형태를 검사한다
          case "$SLUG" in
            ''|*[!a-zA-Z0-9-]*)
              echo "::error::slug가 비었거나 형식이 올바르지 않습니다. 영문·숫자·붙임표만 쓸 수 있습니다."
              exit 1 ;;
          esac
          printf 'slug=%s\n' "$SLUG" >> "$GITHUB_OUTPUT"
          printf 'dry=%s\n'  "$DRY"  >> "$GITHUB_OUTPUT"
          echo "::notice::$SLUG 발행 (모의 실행=$DRY)"

      - name: 카드 확인
        run: |
          SLUG='${{ steps.v.outputs.slug }}'
          test -f "docs/cards/$SLUG/card.json" \
            || { echo "::error::docs/cards/$SLUG 가 없습니다. 카드뉴스 생성이 끝났는지 확인하세요."; exit 1; }
          ls "docs/cards/$SLUG"/*.png

      - name: 발행
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          CARD_BASE_URL: ${{ vars.CARD_BASE_URL }}
        run: |
          SLUG='${{ steps.v.outputs.slug }}'
          python3 scripts/publish_instagram.py \
            "docs/cards/$SLUG/card.json" \
            ${{ steps.v.outputs.dry == 'true' && '--dry-run' || '' }}
