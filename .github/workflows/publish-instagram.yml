name: 인스타그램 발행

# 두 가지 방법으로 실행됩니다.
#   ① 앱이 텔레그램 승인을 받은 뒤 자동으로 (repository_dispatch)
#   ② 사람이 검수 페이지를 보고 손으로 (workflow_dispatch)
on:
  repository_dispatch:
    types: [publish-instagram]
  workflow_dispatch:
    inputs:
      slug:
        description: "발행할 카드뉴스의 slug"
        required: true
      dry_run:
        description: "모의 실행 (실제 발행하지 않음)"
        type: boolean
        default: true

# 같은 slug의 자동 발행은 반드시 직렬화합니다. 첫 실행이 성공해 marker를
# 커밋한 뒤 두 번째 실행이 시작되므로 네트워크 재시도로 인한 중복 게시를 막습니다.
concurrency:
  group: instagram-${{ github.event.client_payload.slug || inputs.slug }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: instagram
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 입력 정리
        id: v
        env:
          P_SLUG: ${{ github.event.client_payload.slug }}
          P_DRY: ${{ github.event.client_payload.dry_run }}
          I_SLUG: ${{ inputs.slug }}
          I_DRY: ${{ inputs.dry_run }}
        run: |
          set -e
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            SLUG="$P_SLUG"
            DRY="$P_DRY"; [ "$DRY" = "true" ] || DRY=false
          else
            SLUG="$I_SLUG"; DRY="$I_DRY"
          fi
          case "$SLUG" in
            ''|*[!a-zA-Z0-9-]*)
              echo "::error::slug가 비었거나 형식이 올바르지 않습니다. 영문·숫자·붙임표만 쓸 수 있습니다."
              exit 1 ;;
          esac
          printf 'slug=%s\n' "$SLUG" >> "$GITHUB_OUTPUT"
          printf 'dry=%s\n'  "$DRY"  >> "$GITHUB_OUTPUT"
          echo "::notice::$SLUG 발행 (모의 실행=$DRY)"

      - name: 카드 및 중복 발행 확인
        id: guard
        run: |
          set -e
          SLUG='${{ steps.v.outputs.slug }}'
          test -f "docs/cards/$SLUG/card.json" \
            || { echo "::error::docs/cards/$SLUG 가 없습니다. 카드뉴스 생성이 끝났는지 확인하세요."; exit 1; }
          if [ "${{ github.event_name }}" = "repository_dispatch" ] && [ -f "docs/cards/$SLUG/.instagram-published" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$SLUG 는 이미 자동 발행 완료된 콘텐츠입니다. 중복 발행을 건너뜁니다."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          ls "docs/cards/$SLUG"/*.png

      - name: 발행
        if: steps.guard.outputs.skip != 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          CARD_BASE_URL: ${{ vars.CARD_BASE_URL }}
        run: |
          SLUG='${{ steps.v.outputs.slug }}'
          python3 scripts/publish_instagram.py \
            "docs/cards/$SLUG/card.json" \
            ${{ steps.v.outputs.dry == 'true' && '--dry-run' || '' }}

      - name: 자동 발행 완료 marker 기록
        if: github.event_name == 'repository_dispatch' && steps.guard.outputs.skip != 'true' && steps.v.outputs.dry != 'true'
        run: |
          set -e
          SLUG='${{ steps.v.outputs.slug }}'
          printf 'published_at=%s\nrun_id=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${{ github.run_id }}" > "docs/cards/$SLUG/.instagram-published"
          git config user.name "silso-bot"
          git config user.email "bot@silsolife.kr"
          git add "docs/cards/$SLUG/.instagram-published"
          git commit -m "인스타그램 발행 완료: $SLUG"
          git push
