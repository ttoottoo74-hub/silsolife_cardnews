name: 실소 콘텐츠랩 오전 7시 주제 발굴

on:
  schedule:
    # 15분마다 확인하고, 콘텐츠랩이 Asia/Seoul 설정 시각 이후 하루 한 번만 실행
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: silso-content-lab-daily-topic
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 콘텐츠랩 예약 실행 확인
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          status="$(curl --silent --show-error --location \
            --connect-timeout 20 --max-time 540 \
            --output "$body_file" --write-out "%{http_code}" \
            --request POST \
            --header "x-silso-scheduler: daily-tick" \
            "https://silso-content-lab.nernous.chatgpt.site/api/automation/daily")"
          cat "$body_file"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "콘텐츠랩 예약 호출 실패 (HTTP $status)" >&2
            exit 1
          fi
